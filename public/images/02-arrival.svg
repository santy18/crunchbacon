<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="vign2" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#vign2)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <!-- CAD workspace panel -->
  <g transform="translate(300,220)" stroke="#f4f4f2" fill="none">
    <rect width="620" height="440" stroke-width="1.5" opacity="0.8"/>
    <path d="M0,0 L620,440 M620,0 L0,440" stroke-width="1" opacity="0.25"/>
    <circle cx="310" cy="220" r="140" stroke-width="1.5" opacity="0.7"/>
    <circle cx="310" cy="220" r="70" stroke-width="1" opacity="0.4"/>
    <path d="M310,80 V360 M170,220 H450" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- terminal panel -->
  <g transform="translate(1020,260)">
    <rect width="600" height="360" fill="#050505" stroke="#f4f4f2" stroke-width="1.5" opacity="0.85"/>
    <g font-family="monospace" fill="#ff6b35" font-size="18" opacity="0.9">
      <text x="30" y="50">&gt; init_build --target=hardware</text>
      <text x="30" y="90" fill="#f4f4f2" opacity="0.7">compiling geometry.......... ok</text>
      <text x="30" y="120" fill="#f4f4f2" opacity="0.6">tolerance check.......... 0.02mm</text>
      <text x="30" y="150" fill="#f4f4f2" opacity="0.5">assigning materials....... done</text>
      <text x="30" y="200" fill="#f4f4f2" opacity="0.3">_</text>
    </g>
  </g>
  <rect x="300" y="220" width="1320" height="440" fill="none" stroke="#f4f4f2" stroke-width="1" opacity="0.15"/>
</svg>
