<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="vign4" cx="50%" cy="55%" r="80%">
      <stop offset="0%" stop-color="#1a1310"/>
      <stop offset="60%" stop-color="#0d0a08"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="devEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff9a5a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#vign4)"/>

  <!-- finished hardware product -->
  <g transform="translate(680,470)">
    <rect x="-160" y="-90" width="320" height="180" rx="24" fill="#111111" stroke="url(#devEdge)" stroke-width="3"/>
    <rect x="-120" y="-50" width="240" height="70" rx="8" fill="#050505" stroke="#ff6b35" stroke-width="1" opacity="0.7"/>
    <circle cx="120" cy="60" r="8" fill="#ff6b35"/>
    <ellipse cx="0" cy="110" rx="200" ry="24" fill="#000000" opacity="0.4" filter="url(#soft)"/>
  </g>

  <!-- hand reaching in, simplified -->
  <g transform="translate(600,760)" fill="#e9c9a8" opacity="0.9">
    <path d="M-40,120 C-60,60 -50,10 -10,-20 C10,-35 40,-30 55,-10 C75,10 70,50 55,90 C40,120 10,140 -40,120 Z"/>
  </g>

  <!-- web app monitor -->
  <g transform="translate(1180,360)">
    <rect x="0" y="0" width="480" height="300" rx="6" fill="#0a0a0a" stroke="#f4f4f2" stroke-width="2" opacity="0.9"/>
    <rect x="20" y="24" width="440" height="252" fill="#050505"/>
    <rect x="40" y="44" width="180" height="16" rx="3" fill="#f4f4f2" opacity="0.5"/>
    <rect x="40" y="80" width="400" height="90" rx="4" fill="#ff6b35" opacity="0.15" stroke="#ff6b35" stroke-width="1"/>
    <polyline points="60,150 120,110 180,130 240,90 300,120 360,80 420,100" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <rect x="40" y="190" width="120" height="60" rx="3" fill="#f4f4f2" opacity="0.08"/>
    <rect x="180" y="190" width="120" height="60" rx="3" fill="#f4f4f2" opacity="0.08"/>
    <rect x="320" y="190" width="120" height="60" rx="3" fill="#f4f4f2" opacity="0.08"/>
    <rect x="200" y="300" width="80" height="14" rx="3" fill="#f4f4f2" opacity="0.6"/>
  </g>
</svg>
