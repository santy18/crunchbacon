<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6ee"/>
      <stop offset="55%" stop-color="#f6e6d3"/>
      <stop offset="100%" stop-color="#eccba0"/>
    </linearGradient>
    <linearGradient id="devEdge2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e0501c"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- window mullions / bright lab daylight -->
  <g stroke="#ffffff" stroke-width="10" opacity="0.5">
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <!-- soft palm silhouettes -->
  <g fill="#c99a63" opacity="0.35">
    <path d="M120,1080 L140,860 Q80,830 40,860 Q100,800 150,820 Q150,760 190,720 Q170,780 200,800 Q250,760 300,780 Q240,800 220,840 Q260,850 280,900 L140,880 Z"/>
    <path d="M1780,1080 L1800,880 Q1740,850 1700,880 Q1760,820 1810,840 Q1810,780 1850,740 Q1830,800 1860,820 Q1900,790 1940,800 L1800,900 Z"/>
  </g>

  <!-- desk -->
  <rect x="0" y="760" width="1920" height="40" fill="#d8b98c"/>

  <!-- finished hardware, full color -->
  <g transform="translate(720,700)">
    <ellipse cx="0" cy="70" rx="220" ry="26" fill="#00000022"/>
    <rect x="-170" y="-90" width="340" height="170" rx="26" fill="#151515" stroke="url(#devEdge2)" stroke-width="4"/>
    <rect x="-130" y="-55" width="260" height="80" rx="8" fill="#050505" stroke="#ff6b35" stroke-width="1.5" opacity="0.8"/>
    <circle cx="130" cy="55" r="9" fill="#ff6b35"/>
    <circle cx="-130" cy="55" r="6" fill="#f4f4f2" opacity="0.6"/>
  </g>

  <!-- active dashboard monitor -->
  <g transform="translate(1160,540)">
    <rect x="-20" y="220" width="40" height="60" fill="#3a3a3a"/>
    <rect x="0" y="0" width="520" height="320" rx="8" fill="#0a0a0a" stroke="#111111" stroke-width="6"/>
    <rect x="18" y="18" width="484" height="284" fill="#050505"/>
    <rect x="40" y="40" width="220" height="18" rx="4" fill="#f4f4f2" opacity="0.6"/>
    <rect x="40" y="80" width="440" height="100" rx="4" fill="#ff6b35" opacity="0.18" stroke="#ff6b35" stroke-width="1.5"/>
    <polyline points="60,160 130,110 200,140 270,90 340,120 410,70 470,100" fill="none" stroke="#ff6b35" stroke-width="4"/>
    <rect x="40" y="200" width="130" height="70" rx="4" fill="#f4f4f2" opacity="0.1"/>
    <rect x="195" y="200" width="130" height="70" rx="4" fill="#f4f4f2" opacity="0.1"/>
    <rect x="350" y="200" width="130" height="70" rx="4" fill="#f4f4f2" opacity="0.1"/>
    <circle cx="480" cy="30" r="6" fill="#3ddc84"/>
  </g>
</svg>
